<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Smart Aptitude Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root {
  --primary:#7c7cff;
  --bg:radial-gradient(1200px 600px at 10% 10%, #1b2a4e, #0f172a);
  --card:rgba(255,255,255,0.92);
  --ok:#22c55e;
  --bad:#ef4444;
}

*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  display:grid;
  place-items:center
}

.card{
  width:95%;
  max-width:820px;
  background:var(--card);
  border-radius:18px;
  padding:22px;
  box-shadow:0 30px 60px rgba(0,0,0,.35)
}

.center{text-align:center}
.big{font-size:42px;font-weight:900}

.btn{
  border:none;
  border-radius:10px;
  padding:10px 16px;
  font-weight:800;
  background:#7c7cff;
  color:#fff;
  cursor:pointer
}

.progress{
  height:10px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin:14px 0
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7c7cff,#22d3ee);
  transition:.3s
}

.opt{
  border:2px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  background:#fff;
  margin:8px 0
}

.correct{border-color:#22c55e;background:#ecfdf5}
.wrong{border-color:#ef4444;background:#fef2f2}
</style>
</head>

<body>

<div class="card">

<div id="start" class="center">
  <h1>🧠 Smart Aptitude Quiz</h1>
  <p>25 Questions • 60s per question</p>
  <button class="btn" onclick="startQuiz()">Start Quiz</button>
</div>

<div id="quiz" style="display:none">

<div>
  Time: <span id="timer">60</span>s |
  Score: <span id="score">0</span>
</div>

<div class="progress">
  <div id="bar" class="bar"></div>
</div>

<div id="question"></div>
<div id="options"></div>

<button class="btn" id="nextBtn" onclick="nextQ()" disabled>Next</button>

</div>

<div id="result" class="center" style="display:none">
  <h2>Quiz Completed</h2>
  <div class="big"><span id="finalScore"></span> / 25</div>
</div>

</div>

<script>

// redirect if participant not logged in
if (!localStorage.getItem("participant")) {
  window.location = "index.html";
}

const quizData = [
  {q:"2 + 2 = ?",o:["3","4","5","6"],a:"4"},
  {q:"5 × 3 = ?",o:["10","15","20","25"],a:"15"},
  {q:"10 / 2 = ?",o:["2","3","5","6"],a:"5"}
];

let i = 0;
let score = 0;
let time = 60;
let timer;

function startQuiz(){
  document.getElementById("start").style.display="none";
  document.getElementById("quiz").style.display="block";
  loadQ();
}

function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    document.getElementById("timer").textContent = --time;
    if(time<=0) nextQ();
  },1000);
}

function loadQ(){
  time=60;
  startTimer();

  const q = quizData[i];

  document.getElementById("question").textContent=q.q;
  document.getElementById("bar").style.width=((i+1)/quizData.length*100)+"%";

  const box=document.getElementById("options");
  box.innerHTML="";

  q.o.forEach(opt=>{
    const d=document.createElement("div");
    d.className="opt";
    d.textContent=opt;
    d.onclick=()=>answer(d,opt,q.a);
    box.appendChild(d);
  });

  document.getElementById("nextBtn").disabled=true;
}

function answer(el,val,correct){

  document.querySelectorAll(".opt").forEach(o=>o.style.pointerEvents="none");

  if(val===correct){
    el.classList.add("correct");
    score++;
  }else{
    el.classList.add("wrong");
  }

  document.getElementById("score").textContent=score;
  document.getElementById("nextBtn").disabled=false;
}

function nextQ(){

  clearInterval(timer);

  i++;

  if(i<quizData.length){
    loadQ();
  }else{
    finish();
  }
}

function finish(){

  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";

  document.getElementById("finalScore").textContent=score;

  const participant_no = localStorage.getItem("participant_no");

  fetch("https://quiz-app-backend-f1yz.onrender.com/api/submit-score",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({score,participant_no})
  })
  .then(res=>res.json())
  .then(data=>console.log("Saved:",data))
  .catch(err=>console.error(err));

}

</script>

</body>
</html>
