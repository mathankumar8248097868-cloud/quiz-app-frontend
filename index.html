<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register - Smart Quiz</title>
<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #1b2a4e, #0f172a);
  color: #fff;
}
.container {
  background: rgba(255,255,255,0.95);
  color: #000;
  padding: 30px 40px;
  border-radius: 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  width: 90%;
  max-width: 400px;
  text-align: center;
}
h1 {
  margin-bottom: 20px;
}
input {
  width: 100%;
  padding: 12px 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 12px;
  border: none;
  background: #7c7cff;
  color: #fff;
  font-weight: bold;
  font-size: 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: #5a5aff;
}
.message {
  margin-top: 10px;
  font-size: 14px;
  padding: 8px 10px;
  border-radius: 8px;
  display: inline-block;
}
.message.success {
  background: #ecfdf5;
  color: #166534;
  border: 1px solid #22c55e;
}
.message.error {
  background: #fee2e2;
  color: #991b1b;
  border: 1px solid #ef4444;
}
</style>
</head>
<body>

<div class="container">
  <h1>🧠 Smart Quiz Register</h1>
  <input type="text" id="name" placeholder="Enter your name" />
  <input type="email" id="email" placeholder="Enter your email" />
  <button onclick="registerUser()">Start Quiz</button>
  <div class="message" id="msg"></div>
</div>

<script>
async function registerUser() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("msg");

  if (!name || !email) {
    msg.className = "message error";
    msg.innerHTML = "❌ Please fill all fields!";
    return;
  }

  try {
    const res = await fetch("https://quiz-app-backend-f1yz.onrender.com/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email })
    });
    const data = await res.json();

    if (data.success) {
      localStorage.setItem("participant_no", data.participant);
      msg.className = "message success";
      msg.innerHTML = `✅ Registered Successfully<br>Your ID: <b>${data.participant}</b>`;

      setTimeout(() => { window.location = "quiz.html"; }, 1500);
    } else {
      msg.className = "message error";
      msg.innerHTML = "❌ " + data.message;
    }

  } catch (err) {
    msg.className = "message error";
    msg.innerHTML = "❌ Something went wrong. Please try again.";
    console.error(err);
  }
}
</script>
</body>
</html>
